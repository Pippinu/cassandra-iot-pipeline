services:
  # ----------------------------------------------------------
  # Zookeeper — required by Kafka for broker coordination.
  # ----------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - iot-network
    mem_limit: 512m

  # ----------------------------------------------------------
  # Kafka broker — message bus for the 3 sensor topic streams.
  # ----------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - iot-network
    mem_limit: 1g

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      - kafka
    networks:
      - iot-network
    command:
      - /bin/bash
      - -ec
      - |
        set -o pipefail
        echo '--- kafka-init starting ---'
        echo '--- Waiting for Kafka broker ---'
        cub kafka-ready -b kafka:29092 1 120
        echo '--- Kafka is ready ---'
        echo '--- Topics before creation ---'
        kafka-topics --bootstrap-server kafka:29092 --list || true
        echo '--- Creating Kafka topics ---'
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic sensor_temp_humidity --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic sensor_light --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic sensor_power --partitions 3 --replication-factor 1
        echo '--- Topics after creation ---'
        kafka-topics --bootstrap-server kafka:29092 --list
        echo '--- kafka-init done ---'
    restart: "no"

  # ----------------------------------------------------------
  # Cassandra schema init service.
  # ----------------------------------------------------------
  cassandra-init:
    image: cassandra:5.0
    container_name: cassandra-init
    depends_on:
      cassandra-1:
        condition: service_healthy
    volumes:
      - ./cassandra/init.cql:/init.cql:ro
    networks:
      - iot-network
    entrypoint: ["/bin/bash", "-c"]
    command: |
      echo '--- Waiting for Cassandra CQL ---'
      until cqlsh cassandra-1 9042 -e "DESCRIBE KEYSPACES" > /dev/null 2>&1; do
        sleep 5
      done
      echo '--- Applying schema ---'
      cqlsh cassandra-1 9042 -f /init.cql
      echo '--- Verifying schema ---'
      cqlsh cassandra-1 9042 -e "SELECT keyspace_name, table_name FROM system_schema.tables WHERE keyspace_name IN ('iot_raw','iot_alerts','iot_analytics');"
      echo '--- cassandra-init done ---'
    restart: "no"

  # ----------------------------------------------------------
  # Cassandra Node 1 — seed node.
  # 
  # Manual init.cql execution (if needed):
  # docker exec -it cassandra-1 cqlsh -f /docker-entrypoint-initdb.d/init.cql
  # ----------------------------------------------------------
  cassandra-1:
    image: cassandra:5.0
    container_name: cassandra-1
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: IoT-Cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 200M
    mem_limit: 1800m
    volumes:
      - cassandra-data-1:/var/lib/cassandra
      - ./cassandra/init.cql:/docker-entrypoint-initdb.d/init.cql:ro
    networks:
      - iot-network
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q '^UN'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s

  # ----------------------------------------------------------
  # Cassandra Node 2 — joins after node 1 is healthy.
  # ----------------------------------------------------------
  cassandra-2:
    image: cassandra:5.0
    container_name: cassandra-2
    command: /bin/bash -c "sleep 45 && /usr/local/bin/docker-entrypoint.sh cassandra -f"
    depends_on:
      cassandra-1:
        condition: service_healthy
    environment:
      CASSANDRA_CLUSTER_NAME: IoT-Cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 200M
    mem_limit: 1500m
    volumes:
      - cassandra-data-2:/var/lib/cassandra
    networks:
      - iot-network
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q '^UN'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s

  # ----------------------------------------------------------
  # Cassandra Node 3 — waits longer, same strategy as before.
  # ----------------------------------------------------------
  cassandra-3:
    image: cassandra:5.0
    container_name: cassandra-3
    command: /bin/bash -c "sleep 120 && /usr/local/bin/docker-entrypoint.sh cassandra -f"
    depends_on:
      cassandra-1:
        condition: service_healthy
    environment:
      CASSANDRA_CLUSTER_NAME: IoT-Cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 200M
    mem_limit: 1500m
    volumes:
      - cassandra-data-3:/var/lib/cassandra
    networks:
      - iot-network
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q '^UN'"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 150s

volumes:
  cassandra-data-1:
  cassandra-data-2:
  cassandra-data-3:
  kafka-data:
  spark-checkpoints:

networks:
  iot-network:
    driver: bridge