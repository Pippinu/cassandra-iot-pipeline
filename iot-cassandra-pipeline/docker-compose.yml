version: '3.8'

# ============================================================
# IoT Sensor Pipeline — Docker Compose
# Services: Zookeeper, Kafka, Cassandra (3 nodes),
#           Producer, Spark Consumer
# Network:  iot-network (bridge)
# ============================================================

services:

  # ----------------------------------------------------------
  # Zookeeper — required by Kafka for broker coordination
  # ----------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - iot-network
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ----------------------------------------------------------
  # Kafka broker — message bus for 3 sensor topic streams
  # Topics: sensor_temp_humidity | sensor_light | sensor_power
  # ----------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics created explicitly below
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    networks:
      - iot-network
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------
  # Kafka topic initializer — creates the 3 sensor topics
  # once the broker is healthy, then exits cleanly.
  # ----------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - iot-networkk
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists         --topic sensor_temp_humidity --partitions 3 --replication-factor 1
      kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists         --topic sensor_light --partitions 3 --replication-factor 1
      kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists         --topic sensor_power --partitions 3 --replication-factor 1
      echo 'Topics created:'
      kafka-topics.sh --bootstrap-server kafka:29092 --list
      echo 'kafka-init done.'
      "
    restart: "no"

  # ----------------------------------------------------------
  # Cassandra Node 1 — seed node
  # Exposes CQL port 9042 for external cqlsh access.
  # Mounts init.cql for schema initialization on first start.
  # ----------------------------------------------------------
  cassandra-1:
    image: cassandra:4.1
    container_name: cassandra-1
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: IoT-Cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 200M
    mem_limit: 1500m
    volumes:
      - cassandra-data-1:/var/lib/cassandra
      - ./cassandra/init.cql:/docker-entrypoint-initdb.d/init.cql:ro
    networks:
      - iot-network
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -E '^UN\\s+' | grep -v grep"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ----------------------------------------------------------
  # Cassandra Node 2 — joins after node 1 is healthy
  # 30s sleep prevents simultaneous ring join with node 3.
  # ----------------------------------------------------------
  cassandra-2:
    image: cassandra:4.1
    container_name: cassandra-2
    command: /bin/bash -c "sleep 30 && /usr/local/bin/docker-entrypoint.sh cassandra -f"
    depends_on:
      cassandra-1:
        condition: service_healthy
    environment:
      CASSANDRA_CLUSTER_NAME: IoT-Cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 200M
    mem_limit: 1500m
    volumes:
      - cassandra-data-2:/var/lib/cassandra
    networks:
      - iot-network
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -E '^UN\\s+' | wc -l | grep -qv '^0'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ----------------------------------------------------------
  # Cassandra Node 3 — joins 60s after node 2 starts
  # Extra delay ensures node 2 has fully joined the ring first.
  # ----------------------------------------------------------
  cassandra-3:
    image: cassandra:4.1
    container_name: cassandra-3
    command: /bin/bash -c "sleep 60 && /usr/local/bin/docker-entrypoint.sh cassandra -f"
    depends_on:
      cassandra-1:
        condition: service_healthy
    environment:
      CASSANDRA_CLUSTER_NAME: IoT-Cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_SEEDS: cassandra-1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 200M
    mem_limit: 1500m
    volumes:
      - cassandra-data-3:/var/lib/cassandra
    networks:
      - iot-network
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -E '^UN\\s+' | wc -l | grep -qv '^0'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s

  # ----------------------------------------------------------
  # Producer — simulates 90 sensors across 3 types and 3 rooms.
  # Starts only after Kafka is healthy and topics are created.
  # Built from Dockerfile.producer (lightweight Python image).
  # ----------------------------------------------------------
  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: producer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: kafka:29092
    networks:
      - iot-network
    mem_limit: 256m
    restart: on-failure

  # ----------------------------------------------------------
  # Spark Consumer — reads from 3 Kafka topics, writes to
  # Cassandra across 3 keyspaces, computes 30s aggregates.
  # Starts only after Kafka and Cassandra node 1 are healthy.
  # Built from Dockerfile.spark (PySpark + connector JARs).
  # ----------------------------------------------------------
  spark-consumer:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-consumer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      cassandra-1:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:29092
      CASSANDRA_HOST: cassandra-1
      CASSANDRA_PORT: "9042"
    volumes:
      - spark-checkpoints:/tmp/spark-checkpoints
    networks:
      - iot-network
    mem_limit: 1500m
    restart: on-failure

# ============================================================
# Volumes — persistent storage for Cassandra data and
#           Spark streaming checkpoints
# ============================================================
volumes:
  cassandra-data-1:
  cassandra-data-2:
  cassandra-data-3:
  spark-checkpoints:

# ============================================================
# Network — isolated bridge network for all services
# ============================================================
networks:
  iot-network:
    driver: bridge
